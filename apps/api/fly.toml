# Patiently API — FastAPI + Postgres on Fly.io
#
# Deployed with a machine always running rather than scale-to-zero: the app
# holds Server-Sent Events connections for the live queue, and a cold start
# mid-demo would drop them.

app = "patiently-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENAI_BASE_URL = "https://api.openai.com/v1"
  OPENAI_MODEL = "gpt-4o-mini"
  OPENAI_MODEL_CLINICAL = "gpt-4o"
  CLINIC_NAME = "Patiently Demo Clinic"

# Migrations run once per deploy, before the new machines take traffic.
[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8000
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
