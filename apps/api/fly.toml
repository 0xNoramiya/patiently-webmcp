# Patiently API — FastAPI + Postgres on Fly.io
#
# Deployed with a machine always running rather than scale-to-zero: the app
# holds Server-Sent Events connections for the live queue, and a cold start
# mid-demo would drop them.

app = "patiently-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENAI_BASE_URL = "https://api.openai.com/v1"
  OPENAI_MODEL = "gpt-5-mini"
  OPENAI_MODEL_CLINICAL = "gpt-5"
  OPENAI_MODEL_TRIAGE = "gpt-4.1-mini"
  OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
  CLINIC_NAME = "Patiently Demo Clinic"
  PATIENTLY_STATIC_DIR = "/app/static"

# Migrations run once per deploy, before the new machines take traffic.
[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# One machine on purpose. Each instance opens its own connection pool
# against a single-node Postgres, and a demo does not need HA — deploy
# with `fly deploy --ha=false` to keep Fly from adding a standby.

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# Generated consultation audio lives here. Without a volume Fly's filesystem is
# ephemeral, so every deploy wiped the MP3s while their database rows survived —
# leaving the dashboard with an audio player pointing at a 404.
[mounts]
  source = "patiently_static"
  destination = "/app/static"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8000
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
